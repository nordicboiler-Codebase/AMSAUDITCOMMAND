[project]
name = "techsource-audit-analytics"
version = "0.1.0"
description = "Internal audit data analytics platform — detector + template architecture"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg2-binary>=2.9",
  "polars>=0.20",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pyarrow>=15.0",
  "streamlit>=1.32",
  "streamlit-aggrid>=0.3.4",
  "weasyprint>=61.0",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "bcrypt<4.1",
  "pyotp>=2.9",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "rapidfuzz>=3.6",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "anthropic>=0.25",
  "charset-normalizer>=3.3",
  "python-dateutil>=2.9",
  "email-validator>=2.1",
  "phonenumbers>=8.13",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "pytest-asyncio>=0.23",
  "ruff>=0.3",
  "mypy>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
