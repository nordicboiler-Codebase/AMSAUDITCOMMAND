services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
      POSTGRES_DB: audit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - audit_data:/app/data
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    depends_on:
      - app
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  pgdata:
  audit_data:
